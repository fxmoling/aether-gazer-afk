[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "anime-game-afk"
version = "0.1.0"
description = "游戏自动化平台"
requires-python = ">=3.11"
dependencies = [
    "MaaFw>=5.9.2",
    "loguru>=0.7.0",
    "numpy>=1.24.0",
    "opencv-python-headless>=4.8.0",
]

[project.optional-dependencies]
gui = [
    "pywebview>=5.0",
]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "pytest-asyncio>=0.21.0",
    "mypy>=1.5.0",
    "ruff>=0.4.0",
]

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
disallow_untyped_defs = true

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
